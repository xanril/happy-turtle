name: Publish MAUI styles

on:
  push:
    branches: [main]
    paths:
      - style-packages/packages/design-tokens/package.json
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: style-packages

jobs:
  check-version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes to main only publish when the design-tokens version actually changed.
      - name: Check design-tokens version change
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file=style-packages/packages/design-tokens/package.json
          current="$(jq -r .version "$file")"
          previous="$(git show "$BEFORE:$file" 2>/dev/null | jq -r .version 2>/dev/null || true)"
          if [ "$current" != "$previous" ]; then
            echo "Version changed: ${previous:-none} -> $current"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($current); skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: style-packages/.nvmrc
          cache: npm
          cache-dependency-path: style-packages/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Install dependencies
        run: npm ci

      - name: Build styles
        run: npm run build:styles

      - name: Resolve package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./packages/design-tokens/package.json').version")"
          if [ -n "$RELEASE_TAG" ] && [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match design-tokens version $version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack package
        run: >
          dotnet pack ./packages/maui-styles/HappyTurtle.Styles.csproj
          --configuration Release
          --output ./packages/maui-styles/dist
          -p:Version="$PACKAGE_VERSION"

      - name: Publish package
        run: >
          dotnet nuget push "./packages/maui-styles/dist/HappyTurtle.Styles.$PACKAGE_VERSION.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
